[project]
name = "friday-tony-stark-demo"
version = "0.1.0"
description = "Friday — A Tony Stark-inspired MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]~=1.6",
    "livekit-plugins-google>=1.5.1",
    "livekit-plugins-groq~=1.6",
    "livekit-plugins-openai~=1.6",
    "livekit-plugins-sarvam~=1.6",
    "livekit-plugins-silero~=1.6",
    "python-dotenv",
]

[project.scripts]
friday = "server:main"
friday_voice = "agent_friday:dev" # Points to the wrapper

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["friday", "server.py", "agent_friday.py"]
exclude = [
    "*.pyc",
    "__pycache__",
    ".venv",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "test_*.py",
    "*_test.py",
    "simple_*.py",
    "hello*.py",
    "add_numbers.py",
    "fail_task.py",
    "feature_task.py",
    "retry_feature.py",
    "fix_test-3_*.py",
    "run_orch_task.py",
    "persist_test.py",
    "orchestration.py",
    "orchestration_*.py",
    "orch_test.py",
    "test_*.py",
    "output_*.py",
    "output_*.txt",
    "ver-*.md",
    "ver-*.txt",
    "VERIFICATION*.md",
    "*.txt",
    "M7*.md",
    "README.md",
    "prompt.txt",
    "project_context.md",
    "capture.txt",
    "iso*.md",
    "iso*.txt",
    "staging*.txt",
    "staged*.txt",
    "output*.txt",
    "task_*.txt",
    "task_*.py",
    "required_content.txt",
    "impossible_content.txt",
    "escalate_output.txt",
    "retry_feature_implementation.py",
    "second_file.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
]
ignore = [
    "PLR2004",  # Magic value used in comparison - allow in tests and simple code
    "TRY003",   # Avoid specifying long messages outside exception class - allow for readability
    "PLC0415",  # Import should be at top-level - allow for optional imports
    "PLR0913",  # Too many arguments - allow for complex functions
    "PLR0917",  # Too many positional arguments - allow for complex functions
    "PLR0915",  # Too many statements - allow for demo functions
    "ERA001",   # Commented-out code - allow for documentation
    "B011",     # assert False - allow in tests
    "PLW0603",  # Global statement - allow in test/demo code
    "TRY300",   # Consider moving to else block - allow for clarity
    "TRY301",   # Abstract raise to inner function - allow for clarity
    "B007",     # Loop variable not used - allow for enumerate when index not needed
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
strict = false
show_error_codes = true
pretty = true

exclude = [
    'test_.*\\.py',
    '.*_test\\.py',
    'simple_.*\\.py',
    'hello.*\\.py',
    'add_numbers\\.py',
    'fail_task\\.py',
    'feature_task\\.py',
    'retry_feature\\.py',
    'fix_test_3_bug_fix\\.py',
    'run_orch_task\\.py',
    'persist_test\\.py',
    'orchestration\\.py',
    'orchestration_.*\\.py',
    'orch_test\\.py',
    'test_.*\\.py',
    'output_.*\\.py',
    'output_.*\\.txt',
    'ver-.*\\.md',
    'ver-.*\\.txt',
    'VERIFICATION.*\\.md',
    '.*\\.txt',
    'M7.*\\.md',
    'README\\.md',
    'prompt\\.txt',
    'project_context\\.md',
    'capture\\.txt',
    'iso.*\\.md',
    'iso.*\\.txt',
    'staging.*\\.txt',
    'staged.*\\.txt',
    'output.*\\.txt',
    'task_.*\\.txt',
    'task_.*\\.py',
    'required_content\\.txt',
    'impossible_content\\.txt',
    'escalate_output\\.txt',
    'friday/assets/data\\.py',
    'friday/ai/prompts/templates\\.py',
    'friday/tools/utils\\.py',
    'friday/tools/system\\.py',
    'friday/orchestration/test_orchestrator\\.py',
    'friday/core/test_.*\\.py',
    'agent_friday\\.py',
    'server\\.py',
    'main\\.py',
    'test-.*\\.py',
    'fix_.*\\.py',
    'fix_test-3_.*\\.py',
    'retry_.*\\.py',
    "friday/context/.*\\.py",
    "friday/tools/.*\\.py",
    "friday/core/.*\\.py",
    "friday/ai/.*\\.py",
    "friday/orchestration/.*\\.py",
    "friday/projects/.*\\.py",
    "friday/memory/.*\\.py",
    "friday/compaction/.*\\.py",
    "friday/filesystem/.*\\.py",
]

[[tool.mypy.overrides]]
module = [
    "friday.tools.retry",
    "friday.tools.retry_feature",
    "friday.tools.retry_demo",
    "friday.tools.retry_database_demo",
    "friday.tools.resilient_web_scraper",
    "friday.tools.resilient_data_fetcher",
    "friday.tools.resilient_cache_client",
    "friday.tools.resilient_api_client",
    "friday.tools.notes",
    "friday.tools.filesystem",
    "friday.tools.web",
    "friday.tools.weather",
    "friday.tools",
    "friday.compaction.*",
    "friday.memory.*",
    "friday.context.*",
    "friday.projects.*",
    "friday.orchestration.*",
    "friday.ai.*",
    "friday.core.*",
]
strict = false
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
